# XcodeGen spec. Generate the project with:  brew install xcodegen && xcodegen
name: Vector
options:
  bundleIdPrefix: app.vector
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set your team ID
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  VectorCore:
    path: Packages/VectorCore

targets:
  Vector:
    type: application
    platform: iOS
    sources:
      - path: App/Vector
      - path: App/Shared
    dependencies:
      - package: VectorCore
      - target: VectorWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vector.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: App/Vector/Resources/Vector.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: App/Vector/Resources/Info.plist
      properties:
        CFBundleDisplayName: Vector
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: Vector uses the camera to photograph meals for AI calorie estimates and to scan food barcodes.
        NSPhotoLibraryUsageDescription: Choose a meal photo to estimate its calories.
        NSHealthShareUsageDescription: Vector reads your body weight to track your trend.
        NSHealthUpdateUsageDescription: Vector saves your strength workouts and weigh-ins to Apple Health.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        # Backend endpoint that proxies the meal-recognition model. Leave empty
        # to use the on-device demo recognizer.
        VectorMealScanEndpoint: ""
        CFBundleURLTypes:
          - CFBundleURLName: app.vector.ios
            CFBundleURLSchemes: [vector]
    entitlements:
      path: App/Vector/Resources/Vector.entitlements
      properties:
        com.apple.security.application-groups: [group.app.vector]
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    scheme:
      testTargets:
        - package: VectorCore/VectorCoreTests
      storeKitConfiguration: App/Vector/Resources/Vector.storekit
      commandLineArguments:
        "-sampleData": false

  VectorWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: App/VectorWidgets
      - path: App/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vector.ios.widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: App/VectorWidgets/VectorWidgets.entitlements
    info:
      path: App/VectorWidgets/Info.plist
      properties:
        CFBundleDisplayName: Vector Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: App/VectorWidgets/VectorWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.app.vector]
